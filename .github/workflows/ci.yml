name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # An integration package and its docs page are generated from one spec.
      # Without this, a hand-edit to either survives review and the next
      # `pnpm gen:integrations` silently reverts it.
      - run: pnpm gen:integrations:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Proves @cloudfarm/core is isomorphic: the same suite under workerd.
      - run: pnpm test:workers
