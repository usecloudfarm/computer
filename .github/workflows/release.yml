name: Release

on:
  push:
    branches: [main]

# Never cancel a run in progress: the tail of this job is `changeset publish`,
# and a publish killed between two packages leaves half a release on npm.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version commit and the release tags
  pull-requests: write # open and update the version PR
  id-token: write # OIDC, for provenance and trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets reads tags to decide what is already released.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # Writes the .npmrc that NODE_AUTH_TOKEN below is read into.
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # `version-script` only bumps and writes changelogs; `publish-script` is
      # the root `release` script, which runs the full gate before it publishes.
      # The gate is what makes this safe to leave on a push trigger: a broken
      # main cannot reach the registry.
      - name: Version or publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Links each published version to this workflow run. pnpm reads the
          # PNPM_CONFIG_ form; the NPM_CONFIG_ one covers the npm CLI, which
          # changesets may shell out to.
          PNPM_CONFIG_PROVENANCE: true
          NPM_CONFIG_PROVENANCE: true

      - name: Say what happened
        if: steps.changesets.outputs.published == 'true'
        run: echo '${{ steps.changesets.outputs.published-packages }}'
