# Packages are grouped by the kind of plugin they implement, so the folder a
# package lives in tells you which interface in @cloudfarm/core it satisfies.
# See .claude/skills/cloudfarm-structure/SKILL.md before adding one.
packages:
  - "packages/*" # core
  - "packages/sandboxes/*" # SandboxProvider: bash, e2b, …
  - "packages/integrations/*" # App: slack, gmail, …
  - "packages/engines/*" # CodeEngine: quickjs, …
  - "packages/toolsets/*" # Toolset: ai, mcp, …
  - "packages/storage/*" # StorageProvider: s3, …
  - "packages/memory/*" # MemoryStore
  - "examples/*"
  - "apps/*" # runnable applications: the chat playground

# Dependencies allowed to run install scripts (pnpm 10 blocks these by default).
onlyBuiltDependencies:
  - esbuild
  - workerd
